<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title>LineDesign HTML</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="shell" class="shell" data-sidebar="expanded">
      <aside id="sidebar" class="sidebar">
        <div class="brand-block">
          <span class="brand-badge">LD</span>
          <div>
            <h1>LineDesign HTML</h1>
            <p>Fase 1 · Simulación</p>
          </div>
        </div>

        <nav class="side-nav">
          <button class="nav-btn is-active" type="button" data-screen="plan" data-title="Planta y Perfil">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="3,12 8,12 11,5 15,19 18,12 21,12" /></svg>
            <span>Planta y Perfil</span>
          </button>
          <button class="nav-btn" type="button" data-screen="catalog" data-title="Catálogo de estructuras">
            <svg class="icon" viewBox="0 0 24 24">
              <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
            <span>Catálogo de estructuras</span>
          </button>
          <button class="nav-btn" type="button" data-screen="hypotheses" data-title="Hipótesis de carga">
            <svg class="icon" viewBox="0 0 24 24"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0z" /></svg>
            <span>Hipótesis de carga</span>
          </button>
          <button class="nav-btn" type="button" data-screen="loadtree" data-title="Árbol de cargas">
            <svg class="icon" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="16" rx="2" /><line x1="3" y1="10" x2="21" y2="10" /><line x1="9" y1="10" x2="9" y2="20" />
            </svg>
            <span>Árbol de cargas</span>
          </button>
        </nav>

        <div class="sidebar-scroll">
          <div class="card">
            <h2>Proyecto</h2>
            <label for="project-name-input">Nombre</label>
            <input id="project-name-input" type="text" />
            <div class="project-meta">
              <span>Unidades</span>
              <strong>SI métrico</strong>
            </div>
            <div class="row-actions row-actions--wrap">
              <button id="export-btn" class="btn btn-small" type="button">Exportar JSON</button>
              <button id="import-btn" class="btn btn-small" type="button">Importar JSON</button>
              <button id="reset-btn" class="btn btn-small btn-danger" type="button">Reiniciar ejemplo</button>
            </div>
            <input id="import-file" type="file" accept="application/json" hidden />
          </div>

          <div class="card">
            <h2>Resumen</h2>
            <ul id="summary-list" class="stack-list"></ul>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button id="sidebar-toggle" class="icon-btn" type="button" aria-label="Mostrar/ocultar menú lateral">
            <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="17" x2="20" y2="17" /></svg>
          </button>
          <h2 id="screen-title" class="screen-title">Planta y Perfil</h2>
          <div class="topbar-spacer"></div>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Alternar tema">
            <svg class="icon icon-sun" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <line x1="12" y1="2" x2="12" y2="4" /><line x1="12" y1="20" x2="12" y2="22" />
              <line x1="4" y1="12" x2="2" y2="12" /><line x1="22" y1="12" x2="20" y2="12" />
              <line x1="5.6" y1="5.6" x2="7" y2="7" /><line x1="17" y1="17" x2="18.4" y2="18.4" />
              <line x1="5.6" y1="18.4" x2="7" y2="17" /><line x1="17" y1="7" x2="18.4" y2="5.6" />
            </svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M21 12.5A9 9 0 1 1 11.5 3 7 7 0 0 0 21 12.5z" /></svg>
          </button>
        </header>

        <div class="workspace-body">
          <section id="screen-plan" class="screen is-active">
            <div class="toolbar">
              <button id="add-vertex-btn" class="btn btn-small" type="button">+ vértice</button>

              <span class="toolbar-sep"></span>

              <select id="new-structure-type"></select>
              <input id="new-structure-station" type="number" step="1" placeholder="station (m)" />
              <button id="add-structure-btn" class="btn btn-small" type="button">+ estructura</button>

              <span class="toolbar-sep"></span>

              <label for="plan-hypothesis-select" class="toolbar-label">Catenaria bajo hipótesis</label>
              <select id="plan-hypothesis-select"></select>
            </div>

            <div id="selection-panel" class="selection-panel" hidden></div>

            <div class="split-view">
              <section class="panel">
                <div class="panel-head">
                  <h2>Planta</h2>
                  <span>arrastra para mover</span>
                </div>
                <svg id="plan-svg" viewBox="0 0 700 520" role="img" aria-label="Vista en planta"></svg>
              </section>

              <section class="panel">
                <div class="panel-head">
                  <h2>Perfil</h2>
                  <span>catenaria del conductor</span>
                </div>
                <svg id="profile-svg" viewBox="0 0 700 520" role="img" aria-label="Vista del perfil"></svg>
              </section>
            </div>
          </section>

          <section id="screen-catalog" class="screen">
            <div id="catalog-container"></div>
          </section>

          <section id="screen-hypotheses" class="screen">
            <div id="hypotheses-container"></div>
          </section>

          <section id="screen-loadtree" class="screen">
            <div id="loadtree-container"></div>
          </section>
        </div>
      </main>
    </div>

    <script src="./src/ui/domUtil.js"></script>
    <script src="./src/ui/svgUtil.js"></script>
    <script src="./src/engine/stationing.js"></script>
    <script src="./src/engine/catenary.js"></script>
    <script src="./src/engine/loadTree.js"></script>
    <script src="./src/data/dataSource.js"></script>
    <script src="./src/data/projectStore.js"></script>
    <script src="./src/ui/theme.js"></script>
    <script src="./src/ui/planView.js"></script>
    <script src="./src/ui/profileView.js"></script>
    <script src="./src/ui/catalogView.js"></script>
    <script src="./src/ui/hypothesesView.js"></script>
    <script src="./src/ui/loadTreeView.js"></script>
    <script src="./src/ui/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((error) => {
            console.warn('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
